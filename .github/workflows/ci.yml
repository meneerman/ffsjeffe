name: ci
on: [push, pull_request]
jobs:
  keep-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r keep_sync/requirements.txt pytest
      - run: python -m pytest keep_sync -q
